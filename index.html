<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>등산대회 QR 카메라</title><style>body{font:16px system-ui;margin:0;background:#10241e;color:white}main{max-width:520px;margin:auto;padding:16px}button,input{font:inherit;padding:12px;margin:4px 0;width:100%;box-sizing:border-box;border-radius:8px}button{background:#d6f2de;color:#10241e;border:0}button:disabled{opacity:.5}#reader{background:#101010;min-height:220px;overflow:hidden;border-radius:10px}#reader video{width:100%}li{padding:6px;overflow-wrap:anywhere}small{color:#c7d9cd}</style><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><main><h1>포인트 QR 연속 스캔</h1><p id="connection">기존 심판 화면 연결 대기</p><div id="reader"></div><button id="start" disabled>후면 카메라 시작</button><button id="stop">카메라 중지</button><p id="status" role="status"></p><input id="manual" placeholder="팀 QR 원문 직접 입력"><button id="send" disabled>QR 입력 전송</button><button id="retry">미확인 기록 다시 전송</button><button id="copy">기록 복사</button><p><small>서버 저장 완료 표시를 확인하세요. 기존 심판 화면을 닫지 마세요. 연결이 끊기면 미확인 기록을 복사하고 다시 연결하세요.</small></p><ol id="history"></ol></main><script>
'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.hash.slice(1)),parentOrigin=params.get('parent'),nonce=params.get('nonce'),openerRef=window.opener;let connected=false,scanner=null,starting=false,stopRequested=false,point='',seq=0;const entries=new Map(),byValue=new Map();
function validParent(){try{const u=new URL(parentOrigin);return u.origin===parentOrigin&&u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||u.hostname.endsWith('.googleusercontent.com'))&&/^[0-9a-f]{32}$/.test(nonce)&&!!openerRef}catch(e){return false}}
function post(data){if(validParent())openerRef.postMessage({...data,nonce},parentOrigin)}
function show(){const list=$('history');list.replaceChildren();for(const x of Array.from(entries.values()).reverse()){const li=document.createElement('li');li.textContent=x.value+' · '+({saved:'저장 완료',queued:'서버 저장 대기',rejected:'확인 필요',retry:'재시도 필요',sent:'응답 대기'}[x.state]||x.state)+(x.message?' · '+x.message:'');list.append(li)}}
function transmit(x){x.state='sent';post({type:'scan',id:x.id,value:x.value,scannedAt:x.scannedAt});show()}
function scan(value){value=String(value||'').trim();if(!connected||!value||value.length>500)return;if(byValue.has(value))return;if(entries.size>=500){$('status').textContent='기록 한도 500건: 서버 저장 확인 후 화면을 다시 여세요.';return;}const x={id:nonce+'-'+(++seq),value,scannedAt:new Date().toISOString(),state:'sent'};entries.set(x.id,x);byValue.set(value,x.id);transmit(x)}
window.addEventListener('message',e=>{const d=e.data;if(e.source!==openerRef||e.origin!==parentOrigin||!d||d.nonce!==nonce)return;if(d.type==='connected'){connected=true;point=d.point;$('connection').textContent='연결 완료 · 포인트 '+point;$('start').disabled=false;$('send').disabled=false;clearInterval(hello)}else if(d.type==='blocked'){connected=false;$('start').disabled=true;$('send').disabled=true;$('connection').textContent=d.message;void stop()}else if(d.type==='result'){const x=entries.get(d.id);if(x&&x.state!=='saved'){x.state=d.state;x.message=d.message;show()}}});
const hello=setInterval(()=>post({type:'ready'}),800);if(validParent())post({type:'ready'});else {$('connection').textContent='심판 화면의 HTTPS 카메라 버튼을 통해 열어 주세요.';clearInterval(hello)}
async function start(){if(!connected||starting||scanner)return;starting=true;stopRequested=false;$('start').disabled=true;try{if(!isSecureContext)throw Error('HTTPS 연결 필요');if(!window.Html5Qrcode)throw Error('QR 인식 라이브러리 연결 실패');scanner=new Html5Qrcode('reader');await scanner.start({facingMode:{ideal:'environment'}},{fps:12},v=>{if(!stopRequested)scan(v)},()=>{});$('status').textContent='카메라 실행 중';}catch(e){$('status').textContent='카메라 오류: '+String(e.message||e);stopRequested=true}finally{starting=false;if(stopRequested)await stop();else $('start').disabled=!!scanner}}
async function stop(){stopRequested=true;if(starting)return;const old=scanner;scanner=null;if(old){try{await old.stop()}catch(e){}try{await old.clear()}catch(e){}}$('start').disabled=!connected;}
$('start').onclick=start;$('stop').onclick=stop;$('send').onclick=()=>{scan($('manual').value);$('manual').value=''};$('retry').onclick=()=>{if(connected)for(const x of entries.values())if(['sent','queued','retry'].includes(x.state))transmit(x)};$('copy').onclick=async()=>{const data=JSON.stringify({point,entries:[...entries.values()]},null,2);try{await navigator.clipboard.writeText(data);$('status').textContent='복사 완료'}catch(e){prompt('기록 복사',data)}};window.addEventListener('pagehide',()=>{void stop()});window.addEventListener('beforeunload',e=>{if([...entries.values()].some(x=>x.state!=='saved')){e.preventDefault();e.returnValue=''}});
</script></body></html>
